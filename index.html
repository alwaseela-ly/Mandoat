<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظومة المبيعات</title>
<style>
:root{--p:#0d5c4b;--p2:#08402f;--bg:#f1f5f3;--c:#fff;--t:#15231f;--m:#66766f;--b:#dde5e1;--r:#c8402f;--a:#f0a81a;--sh:0 2px 12px #0a3d3015}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px 'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}
input,select{padding:9px 11px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--t);max-width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:var(--p);color:#fff;transition:background .15s,transform .1s}
button:hover{background:var(--p2)}button:active{transform:scale(.97)}
button.g{background:#e3eae7;color:var(--t)}button.g:hover{background:#d2dcd8}button.d{background:var(--r)}
button.big{width:100%;padding:15px;font-size:18px;margin-top:12px;background:linear-gradient(135deg,#f5b52e,#e8a317);color:#15231f;font-weight:700;box-shadow:0 4px 12px #e8a31744}
.mu{color:var(--m)}small{color:var(--m);display:block}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#1b8a72,transparent 45%),linear-gradient(135deg,#0d5c4b,#08302a)}
#login form{background:#fff;padding:34px 30px;border-radius:20px;width:min(380px,92vw);display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px #0006}
#login h1{margin:0;color:var(--p);font-size:26px}#login p{margin:0}.lgo{font-size:46px}#lerr{color:var(--r);min-height:20px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap;box-shadow:0 2px 12px #0004;position:sticky;top:0;z-index:4}
header b{font-size:19px}#nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
#nav button{background:#ffffff1c;padding:8px 13px}#nav button:hover{background:#ffffff33}#nav button.on{background:#fff;color:var(--p);font-weight:700}
main{padding:18px;max-width:1350px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row h3{margin:0;flex:1}
.sr{width:100%;padding:12px 14px;font-size:16px}
.pos{display:grid;grid-template-columns:1fr 410px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pc{background:linear-gradient(#fff,#f6faf8);border:1px solid var(--b);border-radius:14px;padding:13px;cursor:pointer;display:grid;gap:5px;transition:transform .12s,box-shadow .12s}
.pc:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh)}.pc.out{opacity:.45}.pc span{color:var(--p);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button.g.on{background:var(--p);color:#fff}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--b)}
.qt{display:flex;gap:4px;align-items:center}.qt input{width:58px;text-align:center}.qt button,.ln>button{padding:6px 10px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tt{display:flex;justify-content:space-between;font-size:22px;margin-top:14px;font-weight:700;color:var(--p)}
label{display:block;margin:10px 0 4px;color:var(--m)}#cart input:not([type=checkbox]){width:100%}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--b);text-align:right;vertical-align:middle}
th{color:var(--m);font-weight:600;background:#f6faf8}tbody tr:hover,tr:hover td{background:#f8fbfa}td input{width:100%;min-width:70px}.tw{overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kp div{background:#fff;border:1px solid var(--b);border-right:4px solid var(--p);border-radius:12px;padding:12px;box-shadow:var(--sh)}.kp b{font-size:18px;display:block;margin-top:4px}
.kp .hl{background:var(--p);color:#fff}
.low{color:var(--r);font-weight:700}
#pbar{position:fixed;bottom:18px;left:18px;background:#15231f;color:#fff;padding:12px 14px;border-radius:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px #0006;z-index:8;animation:up .3s}
@keyframes up{from{transform:translateY(16px);opacity:0}}
#modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9}
.mb{background:#fff;border-radius:16px;padding:20px;width:min(440px,92vw);display:grid;gap:10px}.ln2{display:flex;justify-content:space-between;gap:8px;align-items:center}.ln2 input{width:80px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#15231f;color:#fff;padding:11px 20px;border-radius:10px;z-index:10;box-shadow:0 6px 20px #0005}
#prt{display:none;color:#000}
.inv{font-family:'Segoe UI',Tahoma,Arial,sans-serif}.inv .lg{max-height:70px;max-width:120px}
.inv h1{margin:0 0 4px;color:#0d5c4b;font-size:24px}.inv table{width:100%;border-collapse:collapse}
.inv .mt{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin:10px 0}
.inv .tot{margin-top:12px;width:270px;margin-inline-start:auto}.inv .tot div{display:flex;justify-content:space-between;padding:4px 0}
.inv .tot .gt{font-size:18px;font-weight:700;border-top:2px solid #0d5c4b;margin-top:4px;padding-top:8px}
.inv .ft{text-align:center;margin-top:26px;color:#555}
.inv.a4 .ih{display:flex;align-items:center;gap:16px;border-bottom:3px solid #0d5c4b;padding-bottom:12px}
.inv.a4 th{background:#0d5c4b;color:#fff;padding:9px;text-align:right}.inv.a4 td{padding:9px;border-bottom:1px solid #ddd}
.inv.th{width:76mm;font-size:12px}.inv.th .ih{text-align:center;border-bottom:1px dashed #000;padding-bottom:6px}.inv.th h1{font-size:16px;color:#000}
.inv.th .mt{grid-template-columns:1fr}.inv.th .tot{width:100%}.inv.th th,.inv.th td{padding:2px;border-bottom:1px dashed #000;text-align:right;background:none;color:#000}
.bcw{text-align:center;margin-top:16px}.bcw svg{display:inline-block}.lbs{display:flex;flex-wrap:wrap;gap:6px}.lb{width:50mm;border:1px dashed #999;padding:3px;text-align:center;font-size:11px;break-inside:avoid}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
@media print{body>*{display:none!important}#prt{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="login">
 <form onsubmit="login();return false">
  <div class="lgo">🏪</div><h1>منظومة المبيعات</h1><p class="mu">سجّل الدخول للمتابعة</p>
  <select id="lu"><option value="admin">المدير</option><option value="cashier">الكاشير</option></select>
  <input id="lp" type="password" placeholder="كلمة المرور" autocomplete="off">
  <p id="lerr"></p><small id="lh"></small><button type="submit">تسجيل الدخول</button>
 </form>
</div>
<div id="app" hidden>
 <header><b id="sn"></b><div id="nav"></div><button id="snd" onclick="sendNow()">📤 إرسال التقرير الآن</button><span id="who"></span><button class="g" onclick="logout()">تسجيل الخروج</button></header>
 <main id="main"></main>
</div>
<div id="pbar" hidden></div><div id="modal" hidden></div><div id="prt"></div><div id="toast" hidden></div>
<style id="pgs"></style>
<script>
'use strict';
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const H=s=>{s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();let a=0xdeadbeef,b=0x41c6ce57;for(const ch of String(s)){const c=ch.charCodeAt(0);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);return 'h'+(a>>>0).toString(36)+(b>>>0).toString(36)};
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ML={cash:'نقداً',transfer:'تحويل مصرفي',debt:'دين'};
const KEY='salesSystem_v1';
let db,user=null,tab='pos',ci=0,q='',sk='',rd=dk(new Date()),tt;

function newCart(){return{items:[],cust:'',disc:0,method:'cash'}}
function load(d){
 if(d===undefined){try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=null}}db=d;
 if(!db||typeof db!=='object')db={};
 db.users=db.users||{admin:H('1234'),cashier:H('0000')};
 db.products=db.products||[];db.returns=db.returns||[];db.expenses=db.expenses||[];db.pays=db.pays||[];db.sales=db.sales||[];db.purchases=db.purchases||[];db.seq=db.seq||1;db.codeSeq=db.codeSeq||0;db.logs=db.logs||[];
 let mx=Math.max(0,...db.sales.map(x=>x.no||0));db.sales.filter(x=>!x.no).sort((a,b)=>a.id-b.id).forEach(x=>{x.no=++mx});db.invSeq=Math.max(db.invSeq||0,mx);
 db.set=Object.assign({store:'متجري',cur:'ر.س',tok:'',chat:'',auto:false,notify:false,time:'21:00',last:'',phone:'',addr:'',tax:'',hdr:'',ftr:'شكراً لتعاملكم معنا',logo:'',nl:false},db.set||{});
 db.set.cperm=Object.assign({pos:1,stock:1,ret:1,buy:0,exp:0,cus:0,rep:0,send:1},db.set.cperm||{});
 if(!db.carts||!db.carts.length)db.carts=[newCart()];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('تعذر حفظ البيانات')}}
function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
const m=v=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+db.set.cur;
const cart=()=>db.carts[ci]||(ci=0,db.carts[0]);
const subOf=c=>c.items.reduce((a,i)=>a+i.price*i.q,0);

/* ---------- الباركود وأرقام الفواتير ---------- */
const dig=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const fn=x=>String(x.no||x.id).padStart(4,'0');
const sn=id=>{const x=db.sales.find(v=>v.id===id);return x?fn(x):String(id)};
const C128="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(' ');
function bcSVG(t,k=.32,h=12){
 t=dig(t);const v=[104];let c0=104;
 for(const ch of t){const c=ch.charCodeAt(0)-32;if(c<0||c>94)continue;v.push(c);c0+=c*(v.length-1)}
 v.push(c0%103,106);let x=10,r='';
 v.forEach(c=>{const w=C128[c];for(let i=0;i<w.length;i++){const u=+w[i];if(i%2===0)r+=`<rect x="${x}" width="${u}" height="40"/>`;x+=u}});
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" style="width:${((x+10)*k).toFixed(1)}mm;height:${h}mm;background:#fff" shape-rendering="crispEdges" role="img" aria-label="${esc(t)}"><g fill="#000">${r}</g></svg>`}
function genCode(){let c;do{c='2'+String(++db.codeSeq).padStart(7,'0')}while(db.products.some(p=>p.code===c));return c}

/* ---------- الدخول والتنقل ---------- */
function login(){
 try{
  const u=$('#lu').value,p=$('#lp').value;
  if(db.users[u]&&db.users[u]===H(p)){user=u;logEv('in',u);if(u==='cashier'&&db.set.nl)tg('🔓 دخل الكاشير إلى المنظومة — '+new Date().toLocaleString('ar'));$('#lp').value='';$('#lerr').textContent='';$('#login').hidden=true;$('#app').hidden=false;tab='pos';nav()}
  else{logEv('fail',u);$('#lerr').textContent='كلمة المرور غير صحيحة، أو اخترت المستخدم الخطأ'}
 }catch(e){$('#lerr').textContent='خطأ: '+e.message}}
function hint(){const d=[];if(db.users.admin===H('1234'))d.push('المدير: 1234');if(db.users.cashier===H('0000'))d.push('الكاشير: 0000');
 $('#lh').textContent=d.length?'كلمات المرور الافتراضية — '+d.join(' | '):''}
function logout(){if(user)logEv('out',user);user=null;hint();$('#pbar').hidden=true;$('#app').hidden=true;$('#login').hidden=false}
const TABS={pos:'🛒 البيع',stock:'📦 المخزون',buy:'📥 المشتريات',exp:'💸 المصروفات',cus:'👥 العملاء والديون',ret:'↩️ المرتجعات',rep:'📊 التقارير',log:'🕒 سجل الدخول',set:'⚙️ الإعدادات'};
function nav(t){
 if(t)tab=t;const ok=user==='admin'?Object.keys(TABS):['pos',...Object.keys(TABS).filter(k=>k!=='pos'&&db.set.cperm[k])];if(!ok.includes(tab))tab='pos';
 $('#sn').textContent=db.set.store;$('#who').textContent=user==='admin'?'المدير':'الكاشير';$('#snd').hidden=user!=='admin'&&!db.set.cperm.send;
 $('#nav').innerHTML=ok.map(k=>`<button class="${k===tab?'on':''}" onclick="nav('${k}')">${TABS[k]}</button>`).join('');
 ({pos:vPos,stock:vStock,buy:vBuy,exp:vExp,cus:vCus,ret:vRets,rep:vRep,log:vLog,set:vSet})[tab]()}

/* ---------- البيع ---------- */
function vPos(){
 M.innerHTML=`<div class="pos"><div class="card"><input id="srch" class="sr" placeholder="🔍 ابحث بالاسم، أو امسح الباركود ثم Enter" value="${esc(q)}" oninput="q=this.value;pl()" onkeydown="if(event.key==='Enter')scan(this)"><div class="grid" id="plist"></div></div>
 <div class="card" id="cart"><div class="tabs" id="ctabs"></div><div id="lines"></div>
 <label>اسم العميل (مطلوب عند الدين)</label><input id="cu" list="cnames" value="${esc(cart().cust)}" onchange="cart().cust=this.value.trim();save()"><datalist id="cnames">${[...new Set(db.sales.map(x=>x.cust).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <label>الخصم</label><input id="ds" type="number" min="0" step="0.01" value="${cart().disc||0}" onchange="rl()">
 <div class="pm" id="pm"></div><div class="tt"><span>الإجمالي</span><span id="ttv"></span></div>
 <button class="big" onclick="pay()">إتمام البيع</button></div></div>`;
 pl();rc();rl();$('#srch').focus()}
function scan(el){
 const k=el.value.trim();if(!k)return;let p=db.products.find(x=>x.code&&x.code===k);
 if(!p){const l=db.products.filter(x=>x.name.toLowerCase().includes(k.toLowerCase()));if(l.length===1)p=l[0]}
 if(p){add(p.id);el.value='';q='';pl()}else toast('لا يوجد منتج بهذا الاسم أو الباركود')}
function pl(){
 const k=q.trim().toLowerCase(),l=db.products.filter(p=>p.name.toLowerCase().includes(k));
 $('#plist').innerHTML=l.length?l.map(p=>`<div class="pc${p.qty<=0?' out':''}" onclick="add(${p.id})"><b>${esc(p.name)}</b><span>${m(p.price)}</span><small>المتوفر: ${p.qty}</small></div>`).join(''):'<p class="mu">لا توجد منتجات. أضفها من صفحة المخزون.</p>'}
function rc(){
 $('#ctabs').innerHTML=db.carts.map((x,i)=>`<button class="g${i===ci?' on':''}" onclick="ci=${i};vPos()">فاتورة ${i+1}${x.items.length?' •':''}</button>`).join('')+
 `<button onclick="addCart()">＋ فاتورة جديدة</button><button class="g" onclick="clearCart()">إفراغ</button>`;
 $('#pm').innerHTML=Object.keys(ML).map(k=>`<button class="${cart().method===k?'':'g'}" onclick="cart().method='${k}';save();rc()">${ML[k]}</button>`).join('')}
function rl(){
 const c=cart(),ds=$('#ds');if(ds)c.disc=Math.max(0,n(ds.value));
 const sub=subOf(c),d=Math.min(c.disc||0,sub);save();
 $('#lines').innerHTML=c.items.map((i,x)=>`<div class="ln"><div><b>${esc(i.name)}</b><small>${m(i.price)}</small></div>
 <div class="qt"><button class="g" onclick="cq(${x},-1)">−</button><input type="number" min="1" value="${i.q}" onchange="sq(${x},this.value)"><button class="g" onclick="cq(${x},1)">+</button></div>
 <b>${m(i.price*i.q)}</b><button class="d" onclick="sq(${x},0)" aria-label="حذف">✕</button></div>`).join('')||'<p class="mu">اضغط على منتج لإضافته إلى الفاتورة.</p>';
 $('#ttv').textContent=m(sub-d)}
function add(id){
 const p=db.products.find(x=>x.id===id);if(!p)return;const c=cart(),i=c.items.find(x=>x.id===id);
 if((i?i.q:0)+1>p.qty)return toast('المخزون غير كافٍ');
 if(i)i.q++;else c.items.push({id,name:p.name,price:p.price,cost:p.cost,q:1});rl()}
function cq(x,d){sq(x,cart().items[x].q+d)}
function sq(x,v){
 const c=cart(),i=c.items[x];if(!i)return;v=Math.floor(n(v));const p=db.products.find(z=>z.id===i.id);
 if(v<=0)c.items.splice(x,1);
 else if(!p||v>p.qty){toast('المتوفر في المخزون: '+(p?p.qty:0));i.q=Math.min(i.q,p?p.qty:0);if(i.q<=0)c.items.splice(x,1)}
 else i.q=v;rl()}
function addCart(){db.carts.push(newCart());ci=db.carts.length-1;save();vPos()}
function clearCart(){if(db.carts.length>1){db.carts.splice(ci,1);ci=Math.max(0,ci-1)}else db.carts[0]=newCart();save();vPos()}
function pay(){
 const c=cart(),cu=$('#cu'),ds=$('#ds');if(cu)c.cust=cu.value.trim();if(ds)c.disc=Math.max(0,n(ds.value));
 if(!c.items.length)return toast('الفاتورة فارغة');
 if(c.method==='debt'&&!c.cust)return toast('أدخل اسم العميل لتسجيل الدين');
 for(const it of c.items){const p=db.products.find(x=>x.id===it.id);if(!p||p.qty<it.q)return toast('المخزون غير كافٍ: '+it.name)}
 const sub=subOf(c),disc=Math.min(c.disc||0,sub);
 const s={id:db.seq++,no:++db.invSeq,date:new Date().toISOString(),items:c.items.map(i=>({...i})),sub,disc,total:sub-disc,method:c.method,cust:c.cust,paid:c.method!=='debt',by:user};
 c.items.forEach(it=>{db.products.find(x=>x.id===it.id).qty-=it.q});
 db.sales.push(s);db.lastSale=s.id;
 if(db.carts.length>1){db.carts.splice(ci,1);ci=Math.max(0,ci-1)}else db.carts[0]=newCart();
 save();toast('تم البيع — فاتورة رقم '+fn(s));
 if(db.set.notify)tg(`🧾 فاتورة #${fn(s)}\n${s.items.map(i=>i.name+' × '+i.q).join('\n')}\nالإجمالي: ${m(s.total)}\nالدفع: ${ML[s.method]}${s.cust?'\nالعميل: '+s.cust:''}`);
 vPos();showPB(s.id)}
let pbt;
function showPB(id){
 const b=$('#pbar');b.innerHTML=`<span>✔ تمت الفاتورة #${sn(id)}</span><button onclick="printS(${id},'a4')">🖨 طباعة A4</button><button onclick="printS(${id},'th')">🧾 طابعة حرارية</button><button class="g" onclick="$('#pbar').hidden=true" aria-label="إغلاق">✕</button>`;
 b.hidden=false;clearTimeout(pbt);pbt=setTimeout(()=>{b.hidden=true},10000)}
function printS(id,mode){
 const x=db.sales.find(v=>v.id===id);if(!x)return toast('لا توجد فاتورة للطباعة');
 const S=db.set,th=mode==='th',dt=new Date(x.date);
 $('#pgs').textContent=th?'@page{margin:2mm}':'@page{size:A4;margin:12mm}';

const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0);
function stats(k){
 const S=db.sales.filter(x=>dk(x.date)===k),P=db.purchases.filter(x=>dk(x.date)===k),R=db.returns.filter(x=>dk(x.date)===k),E=db.expenses.filter(x=>dk(x.date)===k);
 const by=t=>sum(S.filter(x=>x.method===t),x=>x.total)-sum(R.filter(x=>x.method===t),x=>x.total);
 const profit=sum(S,x=>sum(x.items,i=>(i.price-i.cost)*i.q)-x.disc)-sum(R,x=>x.profit),exp=sum(E,x=>x.amount);
 return{S,n:S.length,cash:by('cash'),tr:by('transfer'),debt:by('debt'),total:by('cash')+by('transfer')+by('debt'),ret:sum(R,x=>x.total),profit,exp,net:profit-exp,buy:sum(P,x=>x.total)}}
function bal(){
 const b={};db.sales.forEach(x=>{if(x.method==='debt'&&x.cust)b[x.cust]=(b[x.cust]||0)+x.total-(x.ret||0)});
 db.pays.forEach(x=>{b[x.cust]=(b[x.cust]||0)-x.amount});return b}
const debtTotal=()=>sum(Object.values(bal()),v=>Math.max(0,v));
function reportText(k){
 const t=stats(k),low=db.products.filter(p=>p.qty<=p.min),now=k===dk(new Date())?' (حتى '+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+')':'';
 return `📊 تقرير ${db.set.store} — ${k}${now}\n\n🧾 الفواتير: ${t.n}\n💰 صافي المبيعات: ${m(t.total)}\n💵 نقداً: ${m(t.cash)}\n🏦 تحويل: ${m(t.tr)}\n📝 دين: ${m(t.debt)}\n↩️ المرتجعات: ${m(t.ret)}\n🛒 المشتريات: ${m(t.buy)}\n💸 المصروفات: ${m(t.exp)}\n📈 صافي الربح: ${m(t.net)}\n\n⚠️ إجمالي الديون: ${m(debtTotal())}\n📦 منخفضة المخزون: ${low.length?low.map(p=>p.name+' ('+p.qty+')').join('، '):'لا يوجد'}`}
function vRep(d){

 <div class="card"><h3>الفواتير</h3><div class="tw"><table><tr><th>رقم</th><th>الوقت</th><th>العميل</th><th>الدفع</th><th>الإجمالي</th><th></th></tr>
 ${t.S.map(x=>`<tr><td>${fn(x)}</td><td>${esc(new Date(x.date).toLocaleTimeString('ar'))}</td><td>${esc(x.cust)}</td><td>${ML[x.method]}</td><td>${m(x.total)}${x.ret?`<small>مرتجع: ${m(x.ret)}</small>`:''}</td><td><div class="row"><button class="g" onclick="printS(${x.id},'a4')">A4</button><button class="g" onclick="printS(${x.id},'th')">حراري</button><button class="d" onclick="openRet(${x.id})">إرجاع</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="mu">لا توجد فواتير في هذا اليوم.</td></tr>'}</table></div></div>
 <div class="card"><h3>الديون</h3>إجمالي الديون غير المسددة: <b>${m(debtTotal())}</b> — التفاصيل في تبويب «العملاء والديون».</div>
 <div class="card"><h3>منتجات منخفضة المخزون</h3>${low.map(p=>`<div class="low">${esc(p.name)} — ${p.qty}</div>`).join('')||'<span class="mu">كل المنتجات بمستوى جيد.</span>'}</div>`}

function openRet(id){

 $('#modal').innerHTML=`<div class="mb"><h3>إرجاع من فاتورة #${sn(id)}</h3>${x.items.map((i,k)=>`<div class="ln2"><span>${esc(i.name)}<small>المتاح للإرجاع: ${i.q-(i.r||0)}</small></span><input type="number" min="0" max="${i.q-(i.r||0)}" id="rt${k}" value="0"></div>`).join('')}
 <div class="row"><button onclick="doRet(${id})">تأكيد الإرجاع</button><button class="g" onclick="closeM()">إلغاء</button></div></div>`;$('#modal').hidden=false}
function doRet(id){
 const x=db.sales.find(v=>v.id===id);if(!x)return;let tot=0,pf=0;const L=[];
 x.items.forEach((i,k)=>{const v=Math.min(Math.max(0,Math.floor(n($('#rt'+k).value))),i.q-(i.r||0));
  if(v>0){L.push({id:i.id,name:i.name,q:v});tot+=i.price*v;pf+=(i.price-i.cost)*v;i.r=(i.r||0)+v;const p=db.products.find(z=>z.id===i.id);if(p)p.qty+=v}});
 if(!L.length)return toast('حدد كمية للإرجاع');
 const sh=x.sub?x.disc/x.sub:0,refund=tot*(1-sh);
 db.returns.push({id:db.seq++,by:user,date:new Date().toISOString(),sale:id,method:x.method,cust:x.cust,total:refund,profit:pf-tot*sh,items:L});
 x.ret=(x.ret||0)+refund;save();closeM();toast('تم الإرجاع — المبلغ '+m(refund));nav()}

function addE(){const t=$('#et').value.trim(),a=n($('#ea').value);if(!t)return toast('أدخل البيان');if(a<=0)return toast('أدخل مبلغاً صحيحاً');
 db.expenses.push({id:db.seq++,date:new Date().toISOString(),title:t,amount:a});save();vExp()}
function delE(id){if(confirm('حذف هذا المصروف؟')){db.expenses=db.expenses.filter(e=>e.id!==id);save();vExp()}}

/* ---------- العملاء والديون ---------- */
let CN=[];
function vCus(){
 const b=bal();CN=Object.keys(b).filter(k=>Math.abs(b[k])>0.005).sort();
 M.innerHTML=`<div class="kp"><div class="hl">إجمالي الديون<b>${m(debtTotal())}</b></div><div>عدد المدينين<b>${CN.length}</b></div></div>
 <div class="card"><h3>👥 العملاء المدينون</h3><div class="tw"><table><tr><th>العميل</th><th>المتبقي</th><th></th></tr>
 ${CN.map((k,i)=>`<tr><td>${esc(k)}</td><td>${m(b[k])}</td><td><div class="qt"><input id="pc${i}" type="number" min="0" step="0.01" placeholder="المبلغ"><button onclick="payC(${i})">تسجيل دفعة</button><button class="g" onclick="stmt(${i})">كشف حساب</button></div></td></tr>`).join('')||'<tr><td colspan="3" class="mu">لا توجد ديون.</td></tr>'}</table></div></div><div id="cdet"></div>`}
function payC(i){
 const k=CN[i],a=n($('#pc'+i).value),b=bal()[k]||0;
 if(a<=0)return toast('أدخل مبلغاً صحيحاً');if(a>b+0.005)return toast('المبلغ أكبر من المتبقي ('+m(b)+')');
 db.pays.push({id:db.seq++,date:new Date().toISOString(),cust:k,amount:a});save();toast('تم تسجيل الدفعة');vCus()}
function stmt(i){
 const k=CN[i];let r=0;
 const e=[...db.sales.filter(x=>x.method==='debt'&&x.cust===k).map(x=>({d:x.date,t:'فاتورة #'+fn(x),v:x.total-(x.ret||0)})),...db.pays.filter(x=>x.cust===k).map(x=>({d:x.date,t:'دفعة',v:-x.amount}))].sort((a,b)=>a.d<b.d?-1:1);
 $('#cdet').innerHTML=`<div class="card"><h3>كشف حساب: ${esc(k)}</h3><div class="tw"><table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>الرصيد</th></tr>${e.map(x=>{r+=x.v;return `<tr><td>${esc(new Date(x.d).toLocaleDateString('ar'))}</td><td>${x.t}</td><td>${m(x.v)}</td><td>${m(r)}</td></tr>`}).join('')}</table></div></div>`}

/* ---------- تيليجرام ---------- */
async function tg(text){
 const s=db.set;if(!s.tok||!s.chat)return{ok:false,e:'أدخل التوكن ومعرّف الدردشة من الإعدادات'};
 try{
  const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(s.tok.trim())+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({chat_id:s.chat.trim(),text})});
  const j=await r.json();return j.ok?{ok:true}:{ok:false,e:j.description||'خطأ غير معروف'}
 }catch(e){return{ok:false,e:'تعذر الاتصال بالإنترنت'}}}
setInterval(()=>{
 const s=db.set;if(!s||!s.auto||!s.tok)return;const d=new Date(),k=dk(d),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 if(hm>=s.time&&s.last!==k){s.last=k;save();tg(reportText(k)).then(r=>{if(!r.ok){s.last='';save()}})}},30000);

/* ---------- الإعدادات ---------- */
function vSet(){
 const s=db.set;
 M.innerHTML=`<div class="card"><h3>🧾 بيانات المتجر والفاتورة</h3><div class="row"><input id="s1" value="${esc(s.store)}" placeholder="اسم المتجر"><input id="s3" value="${esc(s.phone)}" placeholder="رقم الهاتف"><input id="s4" value="${esc(s.addr)}" placeholder="العنوان"><input id="s5" value="${esc(s.tax)}" placeholder="الرقم الضريبي (اختياري)"></div>
 <div class="row" style="margin-top:8px"><input id="s6" value="${esc(s.hdr)}" placeholder="سطر إضافي أعلى الفاتورة" style="flex:1"><input id="s7" value="${esc(s.ftr)}" placeholder="عبارة أسفل الفاتورة" style="flex:1"><input id="s2" value="${esc(s.cur)}" placeholder="العملة" style="width:100px"></div>
 <div class="row" style="margin-top:8px">${s.logo?`<img src="${s.logo}" alt="" style="max-height:48px"><button class="g" onclick="db.set.logo='';save();vSet()">إزالة الشعار</button>`:''}<label style="margin:0">الشعار:</label><input type="file" accept="image/*" onchange="setLogo(this)"></div>
 <div class="row" style="margin-top:10px"><button onclick="saveSt()">حفظ</button><button class="g" onclick="saveSt();printS(db.lastSale||-1,'a4')">معاينة على آخر فاتورة A4</button></div></div>
 <div class="card"><h3>✈️ تيليجرام</h3><small>أنشئ بوتاً عبر @BotFather وانسخ التوكن، ثم أرسل له رسالة واحصل على رقم الدردشة (Chat ID).</small>
 <div class="row" style="margin-top:10px"><input id="t1" value="${esc(s.tok)}" placeholder="توكن البوت (Bot Token)" style="flex:2;min-width:220px"><input id="t2" value="${esc(s.chat)}" placeholder="Chat ID"></div>
 <label><input type="checkbox" id="t3" style="width:auto" ${s.notify?'checked':''}> إشعار عند كل عملية بيع</label>
 <label><input type="checkbox" id="t6" style="width:auto" ${s.nl?'checked':''}> إشعار عند دخول الكاشير للمنظومة</label>
 <label><input type="checkbox" id="t4" style="width:auto" ${s.auto?'checked':''}> إرسال التقرير اليومي تلقائياً (والبرنامج مفتوح) في الساعة <input type="time" id="t5" value="${esc(s.time)}"></label>
 <div class="row" style="margin-top:10px"><button onclick="saveTg()">حفظ</button><button class="g" onclick="testTg()">رسالة تجربة</button><button onclick="saveTg();sendNow()">📤 إرسال مبيعات اليوم الآن</button></div></div>
 <div class="card"><h3>👁 ما يظهر للكاشير</h3><small>ضع علامة ✓ على ما تريد إظهاره له، وأزلها لإخفائه. التغيير يسري عند دخول الكاشير التالي. الإعدادات وسجل الدخول للمدير فقط دائماً.</small>
 <div style="margin-top:8px">${[['pos','🛒 البيع'],['stock','📦 المخزون'],['ret','↩️ المرتجعات'],['buy','📥 المشتريات'],['exp','💸 المصروفات'],['cus','👥 العملاء والديون'],['rep','📊 التقارير'],['send','📤 زر إرسال التقرير الآن']].map(([k,l])=>`<label style="display:inline-flex;gap:6px;align-items:center;margin:6px 0 6px 18px;color:var(--t)"><input type="checkbox" style="width:auto" ${s.cperm[k]||k==='pos'?'checked':''} ${k==='pos'?'disabled':''} onchange="setPerm('${k}',this.checked)"> ${l}</label>`).join('')}</div></div>
 <div class="card"><h3>🔒 تغيير كلمة المرور</h3><div class="row"><select id="pu"><option value="admin">المدير</option><option value="cashier">الكاشير</option></select>
 <input id="pa" type="password" placeholder="كلمة مرور المدير الحالية"><input id="pn" type="password" placeholder="الكلمة الجديدة"><input id="pn2" type="password" placeholder="تأكيد الكلمة الجديدة"><button onclick="chPw()">تغيير</button></div></div>
 <div class="card"><h3>💾 نسخة احتياطية</h3><div class="row"><button onclick="exp()">تصدير البيانات</button><input type="file" id="imf" accept=".json"><button class="g" onclick="imp()">استيراد</button></div></div>
 <div class="card"><h3>🗑 ضبط المصنع</h3><small>يحذف كل البيانات ويعيد المنظومة كما كانت عند أول تشغيل. يُطلب منك التأكيد قبل التنفيذ.</small><button class="d" style="margin-top:10px" onclick="askReset()">ضبط المصنع</button></div>`}
function saveSt(){
 const a=$('#s1').value.trim();if(!a)return toast('اسم المتجر مطلوب');
 Object.assign(db.set,{store:a,cur:$('#s2').value.trim()||'ر.س',phone:$('#s3').value.trim(),addr:$('#s4').value.trim(),tax:$('#s5').value.trim(),hdr:$('#s6').value.trim(),ftr:$('#s7').value.trim()});
 save();toast('تم الحفظ');$('#sn').textContent=a}
function setLogo(el){
 const f=el.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('اختر ملف صورة');if(f.size>300000)return toast('حجم الشعار كبير (الحد 300KB)');
 const r=new FileReader();r.onload=()=>{saveSt();db.set.logo=r.result;save();toast('تم رفع الشعار');vSet()};r.readAsDataURL(f)}
function saveTg(){const s=db.set;s.tok=$('#t1').value.trim();s.chat=$('#t2').value.trim();s.notify=$('#t3').checked;s.nl=$('#t6').checked;s.auto=$('#t4').checked;s.time=$('#t5').value||'21:00';save();toast('تم حفظ إعدادات تيليجرام')}
async function testTg(){saveTg();const r=await tg('✅ تم ربط منظومة المبيعات — '+db.set.store);toast(r.ok?'وصلت الرسالة':'فشل: '+r.e)}
function setPerm(k,v){db.set.cperm[k]=v?1:0;save();toast('تم حفظ الصلاحيات')}
function chPw(){
 const u=$('#pu').value,a=$('#pa').value,p=$('#pn').value;
 if(db.users.admin!==H(a))return toast('كلمة مرور المدير الحالية غير صحيحة');
 if(p.length<4)return toast('كلمة المرور 4 أحرف على الأقل');if(p!==$('#pn2').value)return toast('كلمتا المرور غير متطابقتين');
 db.users[u]=H(p);save();hint();toast('تم تغيير كلمة المرور');vSet()}
function exp(){
 const b=new Blob([JSON.stringify(db)],{type:'application/json'}),l=document.createElement('a');
 l.href=URL.createObjectURL(b);l.download='sales-backup-'+dk(new Date())+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000)}
function imp(){
 const f=$('#imf').files[0];if(!f)return toast('اختر ملف النسخة الاحتياطية');
 const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.products)||!d.users)throw 0;
  if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟'))return;load(d);save();ci=0;toast('تم استيراد النسخة الاحتياطية');nav()}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}

load();logEv('app');hint();
</script>
</body>
</html>
